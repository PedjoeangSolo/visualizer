<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090914"><title>Neon Studio — Audio Visualizer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#34245f88,transparent 42%),radial-gradient(ellipse at 95% 25%,#12394b77,transparent 38%),#080a13;color:#f7f5ff;font:14px system-ui}.wrap{max-width:1160px;margin:auto;padding:30px 18px}.brand{display:inline-flex;align-items:center;gap:9px;color:#c3f5ff;letter-spacing:.2em;font-weight:900;font-size:12px}.brand:before{content:"";width:8px;height:8px;border-radius:50%;background:#69eaff;box-shadow:0 0 14px #69eaff}h1{font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-.045em;margin:22px 0 9px}.grad{background:linear-gradient(100deg,#fff 8%,#c8a9ff 48%,#6deaff 92%);color:transparent;background-clip:text}.sub{color:#aaaecb;letter-spacing:.02em}.layout{display:grid;grid-template-columns:1.55fr .82fr;gap:18px;margin-top:26px;align-items:start}.panel{background:linear-gradient(145deg,#191b2beF,#10121feF);border:1px solid #cbd4ff20;border-radius:22px;padding:19px;box-shadow:0 18px 55px #0006,inset 0 1px #ffffff08;backdrop-filter:blur(12px)}.stage{height:clamp(310px,45vw,500px);background:#0c1020;border:1px solid #ffffff12;border-radius:17px;overflow:hidden;box-shadow:inset 0 0 45px #0008,0 8px 28px #0004}canvas{width:100%;height:100%;display:block}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}button,select,input{font:inherit}button,select{border:1px solid #ffffff25;background:#101424;color:#f5f6ff;border-radius:11px;padding:11px 13px;transition:border-color .18s,background .18s,transform .18s}button{cursor:pointer}button:hover:not(:disabled){border-color:#8deaff88;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:linear-gradient(105deg,#b49aff,#69eaff);color:#080b16;font-weight:850;border:0;box-shadow:0 5px 20px #67dfff25}input[type=file]{max-width:100%;color:#bfc4dc;font-size:12px}input[type=range]{width:100%;accent-color:#8deaff}label{display:block;color:#b9bfd9;margin:16px 0 7px;font-size:12px;font-weight:650;letter-spacing:.035em}select{width:100%;outline:none}select:focus,button:focus-visible{border-color:#80eaff;outline:2px solid #80eaff33;outline-offset:2px}.side{display:grid;gap:16px}.side .panel>b{font-size:11px;letter-spacing:.16em;color:#d5d8f2}.status{padding:12px 13px;border:1px solid #75eaff22;border-radius:12px;background:linear-gradient(110deg,#52e5ff12,#aa8cff0d);color:#c8f6ff;margin-top:13px;font-size:12px;line-height:1.5}.hint{color:#999fbd;font-size:12px;line-height:1.6}#track{overflow-wrap:anywhere}@media(max-width:760px){.wrap{padding:22px 13px}.layout{grid-template-columns:1fr;gap:14px}.stage{height:300px}.panel{padding:15px}.side{gap:13px}}
</style></head><body><div class="wrap"><div class="brand">♫ NEON STUDIO</div><h1><span class="grad">Feel the rhythm.</span><br>Shape your visual.</h1><p class="sub">Audio visualizer real-time.</p>
<div class="layout"><main class="panel"><div class="stage"><canvas id="viz"></canvas></div><div class="row"><input id="audioFile" type="file" accept="audio/*,.flac,.m4a,.aac"><button id="play" class="primary" disabled>▶ Play</button><button id="stop">■ Stop</button></div><p id="track" class="hint">Pilih file audio dari perangkat.</p></main>
<aside class="side"><section class="panel"><b>VISUAL CUSTOMIZATION</b><label>Mode visual</label><select id="mode"><option value="fusion">Neon Fusion</option><option value="circle">Circular</option><option value="bars">Equalizer</option><option value="wave">Waveform</option></select><label>Warna</label><select id="color"><option value="purple">Purple / Cyan</option><option value="pink">Pink / Gold</option><option value="green">Mint / Cyan</option><option value="ice">Ice Blue</option></select><label>Intensitas</label><input id="intensity" type="range" min="20" max="100" value="75"></section>
<section class="panel"><b>VIDEO EXPORT</b><label>Format</label><select id="format"><option value="mp4">MP4 (H.264)</option><option value="webm">WebM (VP9/VP8)</option></select><label>Resolusi</label><select id="resolution"><option value="1280x720">720p HD</option><option value="1920x1080" selected>1080p Full HD (YouTube)</option><option value="2560x1440">1440p QHD</option></select><label>Frame rate</label><select id="fps"><option>24</option><option>30</option><option selected>60</option><option>90</option></select><label>Bitrate</label><select id="bitrate"><option value="4">4 Mbps</option><option value="8" selected>8 Mbps</option><option value="12">12 Mbps</option><option value="20">20 Mbps</option></select><button id="export" class="primary" style="width:100%;margin-top:15px" disabled>Mulai ekspor</button><div id="status" class="status">Memeriksa dukungan browser…</div><p class="hint">MP4 hanya aktif bila browser mendukung codec. Jika tidak, pilih WebM. FPS aktual bergantung pada perangkat.</p></section></aside></div></div>
<audio id="audio" crossorigin="anonymous"></audio>
<script>
(()=>{const $=id=>document.getElementById(id),a=$('audio'),c=$('viz'),g=c.getContext('2d',{alpha:false});let ac,an,src,data,floatData,waveData=new Uint8Array(256),smoothed=new Float32Array(128),rec,recording=false,raf;const palettes={purple:['#aa8cff','#52e5ff'],pink:['#ff58c7','#ffbd69'],green:['#58efa8','#52e5ff'],ice:['#b9f3ff','#5aaeff']};function resize(){const d=Math.min(devicePixelRatio||1,1.25),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0)}if('ResizeObserver'in window)new ResizeObserver(resize).observe(c);else window.addEventListener('resize',resize);resize();
async function setup(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=0;src=ac.createMediaElementSource(a);src.connect(an);an.connect(ac.destination);waveData=new Uint8Array(an.fftSize)}if(ac.state==='suspended')await ac.resume()}
// Read the analyser's real time-domain samples. Each visual segment is the RMS
// amplitude of its own slice of the current audio waveform (not FFT bands or
// generated beat animation), so Circular and Equalizer react to the source signal.
function getWaveBands(count){
 const levels=new Float32Array(count);
 if(!an||!waveData)return levels;
 const samples=waveData.length;
 for(let i=0;i<count;i++){
  const start=Math.floor(i*samples/count),end=Math.max(start+1,Math.floor((i+1)*samples/count));
  let power=0,n=0;
  for(let j=start;j<Math.min(end,samples);j++){
   const sample=(waveData[j]-128)/128;
   power+=sample*sample;n++;
  }
  const rms=n?Math.sqrt(power/n):0;
  levels[i]=Math.min(1,rms/.28);
 }
 return levels;
}
let lastFrame=0;
function draw(now=0){raf=requestAnimationFrame(draw);if(now-lastFrame<33)return;lastFrame=now;const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;const x=w/2,y=h/2,p=palettes[$('color').value],mode=$('mode').value,k=+$('intensity').value/100;
if(an){an.getByteTimeDomainData(waveData)}
g.clearRect(0,0,w,h);
// Layered visualizer backdrop: deep gradient, soft color blooms, and a subtle grid.
const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#11132b');bg.addColorStop(.52,'#090d1b');bg.addColorStop(1,'#10152a');g.fillStyle=bg;g.fillRect(0,0,w,h);
const bloom1=g.createRadialGradient(w*.22,h*.22,0,w*.22,h*.22,Math.max(w,h)*.62);bloom1.addColorStop(0,p[0]+'30');bloom1.addColorStop(1,'transparent');g.fillStyle=bloom1;g.fillRect(0,0,w,h);
const bloom2=g.createRadialGradient(w*.82,h*.72,0,w*.82,h*.72,Math.max(w,h)*.55);bloom2.addColorStop(0,p[1]+'25');bloom2.addColorStop(1,'transparent');g.fillStyle=bloom2;g.fillRect(0,0,w,h);
g.save();g.strokeStyle='#c8d8ff12';g.lineWidth=1;const grid=Math.max(28,Math.round(Math.min(w,h)/9));for(let gx=0;gx<=w;gx+=grid){g.beginPath();g.moveTo(gx,0);g.lineTo(gx,h);g.stroke()}for(let gy=0;gy<=h;gy+=grid){g.beginPath();g.moveTo(0,gy);g.lineTo(w,gy);g.stroke()}g.restore();
const circleBands=getWaveBands(96),barBands=getWaveBands(48),energy=barBands.reduce((a,b)=>a+b,0)/barBands.length,base=Math.min(w,h)*.16;
g.save();g.globalCompositeOperation='lighter';
if(mode==='fusion'||mode==='circle'){
 const count=mode==='circle'?96:72;
 // Fine orbit rings add depth without expensive blur or per-frame gradients.
 g.globalAlpha=.16;g.strokeStyle=p[1];g.lineWidth=1;g.beginPath();g.arc(x,y,base*1.02,0,Math.PI*2);g.stroke();
 g.globalAlpha=.11;g.beginPath();g.arc(x,y,base*1.72,0,Math.PI*2);g.stroke();
 for(let i=0;i<count;i++){const angle=i/count*Math.PI*2-Math.PI/2,n=circleBands[Math.floor(i*96/count)],inner=base*1.08,outer=inner+Math.max(2,n*base*1.85*k);g.strokeStyle=i%2?p[0]:p[1];g.globalAlpha=.28+n*.68;g.lineWidth=1.4+n*1.25;g.lineCap='round';g.beginPath();g.moveTo(x+Math.cos(angle)*inner,y+Math.sin(angle)*inner);g.lineTo(x+Math.cos(angle)*outer,y+Math.sin(angle)*outer);g.stroke()}
 // Compact luminous core and inner ring.
 g.globalAlpha=.72;g.strokeStyle=p[1];g.lineWidth=1.4;g.beginPath();g.arc(x,y,base*.72+energy*base*.25,0,Math.PI*2);g.stroke();
 g.globalAlpha=.16;g.fillStyle=p[0];g.beginPath();g.arc(x,y,base*.58,0,Math.PI*2);g.fill();
 g.globalAlpha=.85;g.fillStyle='#f3f8ff';g.beginPath();g.arc(x,y,2.2+energy*3,0,Math.PI*2);g.fill();
}
if(mode==='fusion'||mode==='bars'){
 const count=48,gap=w/count*.34,bw=w/count-gap,mid=h*.83;
 for(let i=0;i<count;i++){const n=barBands[i],hh=3+n*h*.31*k,xx=i*w/count+gap*.5;
  g.globalAlpha=.13;g.fillStyle=p[1];g.fillRect(xx,mid-h*.31,bw,h*.31);
  g.globalAlpha=.72+n*.28;g.fillStyle=i%2?p[0]:p[1];
  const radius=Math.min(bw*.42,5),top=mid-hh;
  g.beginPath();g.moveTo(xx+radius,top);g.lineTo(xx+bw-radius,top);g.quadraticCurveTo(xx+bw,top,xx+bw,top+radius);g.lineTo(xx+bw,mid-radius);g.quadraticCurveTo(xx+bw,mid,xx+bw-radius,mid);g.lineTo(xx+radius,mid);g.quadraticCurveTo(xx,mid,xx,mid-radius);g.lineTo(xx,top+radius);g.quadraticCurveTo(xx,top,xx+radius,top);g.closePath();g.fill();
 }
}
if(mode==='fusion'||mode==='wave'){
 g.beginPath();const center=mode==='wave'?h*.5:h*.78,step=2;for(let i=0;i<=w;i+=step){const idx=Math.min(waveData.length-1,Math.floor(i/w*waveData.length)),sample=((waveData[idx]||128)-128)/128,yy=center+sample*h*.2*k;if(i===0)g.moveTo(i,yy);else g.lineTo(i,yy)}g.save();g.globalAlpha=.95;g.strokeStyle='#ffffff';g.lineWidth=2;g.shadowColor='#ffffff';g.shadowBlur=mode==='wave'?13:9;g.stroke();g.shadowBlur=0;g.globalAlpha=.9;g.lineWidth=1.35;g.stroke();g.restore();
}
g.restore()}
draw();
$('audioFile').onchange=e=>{const f=e.target.files[0];if(!f)return;a.pause();a.src=URL.createObjectURL(f);a.load();$('track').textContent=f.name;$('play').disabled=false;check()};$('play').onclick=async()=>{try{await setup();await a.play();$('play').textContent='Ⅱ'}catch(e){$('status').textContent='Pemutaran gagal: '+e.message}};$('stop').onclick=()=>{a.pause();a.currentTime=0;$('play').textContent='▶ Play'};a.onended=()=>{$('play').textContent='▶ Play'};a.onerror=()=>{$('status').textContent='File audio tidak dapat dibaca browser. Coba MP3, WAV, atau M4A yang kompatibel.'};
function mime(){if(!window.MediaRecorder)return null;const mp4=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'],webm=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];return ($('format').value==='mp4'?mp4:webm).find(x=>MediaRecorder.isTypeSupported(x))||null}
function check(){const m=mime(),issues=[];if(!m)issues.push('Format tidak didukung browser ini. Coba WebM.');if(!c.captureStream)issues.push('Canvas capture tidak tersedia.');if(+$('fps').value===90)issues.push('90 FPS eksperimental.');if(+$('fps').value===60&&$('resolution').value==='1920x1080')issues.push('1080p60 cukup berat; bisa terjadi frame drop/panas.');$('status').textContent=issues.join(' ')||'Codec terdeteksi. Performa ekspor bergantung pada perangkat.';$('export').disabled=!m||!c.captureStream||!a.src;return m}
['format','resolution','fps','bitrate'].forEach(id=>$(id).onchange=check);check();
$('export').onclick=async()=>{if(recording){rec.stop();return}const mt=check();if(!mt)return;try{await setup();if(a.paused)await a.play();const [w,h]=$('resolution').value.split('x').map(Number),fps=+$('fps').value,out=document.createElement('canvas');out.width=w;out.height=h;const og=out.getContext('2d'),stream=out.captureStream(fps),dest=ac.createMediaStreamDestination();src.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let live=true;function paint(){og.fillStyle='#090914';og.fillRect(0,0,w,h);og.drawImage(c,0,0,w,h);if(live)requestAnimationFrame(paint)}paint();const chunks=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:+$('bitrate').value*1e6,audioBitsPerSecond:192000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{live=false;recording=false;const ext=mt.includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:mt}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='neon-studio.'+ext;link.click();stream.getTracks().forEach(t=>t.stop());$('export').textContent='Mulai ekspor';$('status').textContent='Video tersimpan: '+ext.toUpperCase()};rec.start();recording=true;$('export').textContent='STOP & SIMPAN';$('status').textContent='Sedang merekam '+w+'×'+h+' @ '+fps+' FPS.'}catch(e){recording=false;$('status').textContent='Ekspor gagal: '+e.message+' — coba WebM 720p30.'}};
})();
</script></body></html>
